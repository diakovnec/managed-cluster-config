apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-test
  namespace: hypershift-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics-test
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: host-network
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
    ports:
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  - ports:
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 443
